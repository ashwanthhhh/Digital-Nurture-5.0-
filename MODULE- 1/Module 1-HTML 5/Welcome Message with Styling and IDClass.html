<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Welcome Banner</title>

    <style>

        /* ID Selector */
        #welcomeBanner{
            background-color: blue;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
        }

        /* Class Selector */
        .highlight{
            background-color: yellow;
            font-weight: bold;
            padding: 5px;
        }

    </style>
</head>

<body>

    <div id="welcomeBanner">
        Welcome Back, Resident!
    </div>

    <p>
        Register today and get

        <span style="color:red; font-weight:bold;">
            20% OFF
        </span>

        on premium event passes.
    </p>

    <p class="highlight">
        Upcoming Music Festival Registration Open!
    </p>

    <h3 class="highlight">
        Limited Seats Available
    </h3>

</body>
</html>
