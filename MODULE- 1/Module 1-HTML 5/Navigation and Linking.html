<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Navigation and Linking</title>

    <style>
        nav{
            background-color: navy;
            padding: 15px;
        }

        nav a{
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        section{
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <!-- Navigation Section -->
    <nav>
        <a href="#home">Home</a>
        <a href="#events">Events</a>
        <a href="#contact">Contact</a>

        <!-- External Link -->
        <a href="help.html" target="_blank">Help</a>
    </nav>

    <!-- Home Section -->
    <section id="home">
        <h2>Home</h2>
        <p>Welcome to the Local Community Event Portal.</p>
    </section>

    <!-- Events Section -->
    <section id="events">
        <h2>Events</h2>
        <p>View upcoming community events and activities.</p>
    </section>

    <!-- Contact Section -->
    <section id="contact">
        <h2>Contact</h2>
        <p>Email: community@portal.com</p>
    </section>

</body>
</html>
