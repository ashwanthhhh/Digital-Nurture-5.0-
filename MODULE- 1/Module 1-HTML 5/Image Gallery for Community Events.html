<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Community Event Gallery</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            text-align: center;
        }

        /* Image Styling Class */
        .eventImage{
            width: 200px;
            height: 150px;
            border: 3px solid navy;
            border-radius: 10px;
            padding: 5px;
        }

        table{
            margin: auto;
            border-spacing: 15px;
        }

        caption{
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

    </style>
</head>

<body>

    <table>

        <caption>Community Events Gallery</caption>

        <tr>
            <td>
                <img src="https://via.placeholder.com/200x150"
                     alt="Music Festival"
                     title="Music Festival"
                     class="eventImage">
                <br>
                <b>Music Festival</b>
            </td>

            <td>
                <img src="https://via.placeholder.com/200x150"
                     alt="Food Carnival"
                     title="Food Carnival"
                     class="eventImage">
                <br>
                <b>Food Carnival</b>
            </td>

            <td>
                <img src="https://via.placeholder.com/200x150"
                     alt="Book Fair"
                     title="Book Fair"
                     class="eventImage">
                <br>
                <b>Book Fair</b>
            </td>
        </tr>

        <tr>
            <td>
                <img src="https://via.placeholder.com/200x150"
                     alt="Sports Meet"
                     title="Sports Meet"
                     class="eventImage">
                <br>
                <b>Sports Meet</b>
            </td>

            <td>
                <img src="https://via.placeholder.com/200x150"
                     alt="Art Exhibition"
                     title="Art Exhibition"
                     class="eventImage">
                <br>
                <b>Art Exhibition</b>
            </td>

            <td>
                <img src="https://via.placeholder.com/200x150"
                     alt="Cultural Program"
                     title="Cultural Program"
                     class="eventImage">
                <br>
                <b>Cultural Program</b>
            </td>
        </tr>

    </table>

</body>
</html>
