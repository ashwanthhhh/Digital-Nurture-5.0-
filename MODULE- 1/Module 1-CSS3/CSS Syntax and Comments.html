<!DOCTYPE html>
<html>
<head>
    <title>CSS Syntax and Comments</title>

    <style>

        /* Style for page background */
        body{
            background-color: #f4f4f4;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        /* Style for main heading */
        h1{
            color: darkblue;
        }

        /* Style for main CTA button */
        .cta-button{
            background-color: #007BFF;
            color: white;
            padding: 10px 20px;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        /* Style for paragraph */
        p{
            color: gray;
            font-size: 18px;
        }

    </style>
</head>
<body>

    <h1>Local Community Event Portal</h1>

    <p>Join exciting events happening in your community.</p>

    <button class="cta-button">
        Register Now
    </button>

</body>
</html>
