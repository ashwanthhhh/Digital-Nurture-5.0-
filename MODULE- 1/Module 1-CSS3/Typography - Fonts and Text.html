<!DOCTYPE html>
<html>
<head>
    <title>Typography Styling</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>

        body{
            font-family: 'Poppins', sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        /* Main Heading */
        h1{
            font-size: 36px;
            font-weight: 600;
            text-align: center;
            text-transform: uppercase;
            color: navy;
        }

        /* Sub Heading */
        h2{
            font-size: 28px;
            font-style: italic;
            color: darkgreen;
        }

        /* Event Description */
        .description{
            font-size: 18px;
            font-weight: 400;
            text-align: justify;
            text-transform: capitalize;
            letter-spacing: 2px;
            line-height: 1.8;
            color: #333;
        }

    </style>
</head>
<body>

    <h1>Local Community Event Portal</h1>

    <h2>Upcoming Events</h2>

    <p class="description">
        Welcome to the local community event portal. Explore exciting events,
        cultural programs, food festivals, and social gatherings happening in
        your area.
    </p>

</body>
</html>
