<!DOCTYPE html>
<html>
<head>
    <title>Debug and Test with DevTools</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1{
            text-align: center;
            background-color: navy;
            color: white;
            padding: 15px;
        }

        .eventCard{
            width: 300px;
            border: 2px solid gray;
            padding: 20px;
            margin: 20px auto;
            text-align: center;
            background-color: lightyellow;
        }

        img{
            width: 100%;
            height: auto;
        }

        @media screen and (max-width:768px){
            .eventCard{
                width: 90%;
            }

            h1{
                font-size: 24px;
            }
        }
    </style>

</head>
<body>

    <h1>Local Community Event Portal</h1>

    <div class="eventCard">
        <img src="https://via.placeholder.com/300x150" alt="Event Image">

        <h3>Community Music Festival</h3>

        <p>
            Test this page using Chrome DevTools to check responsiveness.
        </p>
    </div>

</body>
</html>
