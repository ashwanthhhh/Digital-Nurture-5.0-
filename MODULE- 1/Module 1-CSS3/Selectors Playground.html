<!DOCTYPE html>
<html>
<head>
    <title>Selectors Playground</title>

    <style>

        /* Universal Selector */
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Element Selector */
        h2{
            color: green;
            margin: 20px;
        }

        /* ID Selector */
        #mainHeader{
            background-color: navy;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* Class Selector */
        .eventCard{
            border: 2px solid gray;
            padding: 15px;
            margin: 20px;
            background-color: lightyellow;
        }

        /* Grouping Selector */
        h3, p{
            color: brown;
            font-family: Arial, sans-serif;
        }

    </style>
</head>
<body>

    <h1 id="mainHeader">
        Local Community Event Portal
    </h1>

    <h2>Upcoming Events</h2>

    <div class="eventCard">
        <h3>Music Festival</h3>
        <p>Enjoy live music and entertainment.</p>
    </div>

    <div class="eventCard">
        <h3>Food Carnival</h3>
        <p>Explore delicious foods from different regions.</p>
    </div>

</body>
</html>
